{% extends 'reusable_components/page.html' %}

{% load static %}

<body>
    {% block content %}



    <!-- slider Area Start-->

    <!-- slider Area End-->

    <!--================Sign Up  Area =================-->
    <section class="login_part ">


        {{ error }}


        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-12 col-md-12">
                <h3 style="margin-bottom:30px;">Add Product</h3>


                    {% if notification %}
                        <span id="notification_block" class="notify-hider {{ notification.type }}">
                            {{ notification.message }}
                        </span>
                    {% endif %}
                    <!--  Fromr sexction --->
                <div class="container-fluid">
                <form class="panel panel-info form-horizontal" action="{% url 'add_product' %}" enctype="multipart/form-data" Method="POST">
                    <div class="panel-body">
                    {% csrf_token %}

                    <div class="row">

                        <div class="col-sm-6 form-group">
                            <label>
                                Product Title:
                            </label>
                            <input  class="form-control" type="text" name="prod_name" />
                        </div>


                        <div class="col-sm-4 offset-sm-2 form-group">
                            <label>
                                Product Price (PKR):
                            </label>
                            <input  class="form-control" type="text" name="prod_price" />
                        </div>


                        <div class="col-sm-6 form-group">
                            <label>
                                Description
                            </label>
                            <textarea  class="form-control" type="text" name="prod_description"></textarea>
                        </div>

                        <div class="col-sm-4 offset-sm-2 form-group">
                            <label>
                                Featured Image (choose file):
                            </label>
                            <input type="file" accept=".jpg,.jpeg,.png" name="featured_image">
                        </div>



                        <div class="col-sm-6 form-group">

                            <button class="btn primary-btn" style="margin-top:30px;">Save</button>
                        </div>



                    </div>



                    </div>
			    </form>

	</div>
         </div>
            </div>
        </div>
    </section>
    <!--================login_part end =================-->
{% endblock %}
