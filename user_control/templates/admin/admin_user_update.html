{% extends 'reusable_components/page.html' %}

{% load static %}

<body>
    {% block content %}

   

    <!-- slider Area Start-->
    
    <!-- slider Area End-->

    <!--================Sign Up  Area =================-->
    <section class="login_part ">


        {{ error }}


        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-12 col-md-12">
                <h3 style="margin-bottom:30px;">Edit Profile Info</h3>
                    <!--  Fromr sexction --->
                <div class="container-fluid">
                <form class="panel panel-info form-horizontal" action="{% url 'edit_user' mainUser.id %}" Method="POST">
				<div class="panel-body">
                {% csrf_token %}
                <input type="hidden" id="account_type" name="account_type" value="Customer" required/>
                <div class="form-group row">
                        <label for="Email" class="control-label col-md-2"> 
                            Email:
                        </label>
                        <div class="col-md-8">
                            <input type="email" id="Email" name="Email"  class="form-control" placeholder="e.g: Guest@domain.om" readonly value="{{mainUser.email}}" required/>
                        </div>
				</div>
				<div class="form-group row">
				<label for="Password" class="control-label col-md-2">
                 Password:
                 </label>
                    <div class="col-md-8">
                        <div class="row">
                            <div class="col-md-6">
                                <input type="password" id="Password" name="Password" class="form-control" placeholder="Password" value="{{User.Password}}"/>
                            </div>
                            
                            <div class="col-md-6">
                                <input type="password" id="RePassword" name="RePassword" class="form-control" placeholder="Confirm Password" value=""/>
                            </div>	
                        </div>
                    </div>
				</div>


                <div class="form-group row">
				<label for="name" class="control-label col-md-2">
                 Name:
                 </label>
                    <div class="col-md-8">
                        <div class="row">
                            <div class="col-md-6">
                                <input type="text" id="FirstName" name="FirstName" class="form-control" placeholder="First Name" value="{{mainUser.first_name}}" required/>
                            </div>
                            
                            <div class="col-md-6">
                                <input type="text" id="LastName" name="LastName" class="form-control" placeholder="Last Name"  value="{{mainUser.last_name}}" required/>
                            </div>	
                        </div>
                    </div>
				</div>


				  <div class="form-group row">
				<label for="name" class="control-label col-md-2">
                 Address 2:
                 </label>
                    <div class="col-md-8">
                        <div class="row">
                            <div class="col-md-6">
                                <input type="text" id="City" name="City" class="form-control" placeholder="City" value="{{User.City}}" required/>
                            </div>
                            
                            <div class="col-md-6">
                                <input type="text" id="Country" name="Country" class="form-control" placeholder="Country"  value="{{User.Country}}" required/>
                            </div>	
                        </div>
                    </div>
				</div>


				<div class="form-group row">
				<label for="zipCode"class="control-label col-md-2">ZIP Code:</label>
				<div class="col-md-8">
				<input type="number" name="zipCode" id="zipCode" class="form-control" placeholder="e.g:" value="{{User.zipCode}}" required/>
				</div>
				</div>


				<div class="form-group row">
					<label for="Phone" class="control-label col-md-2">Phone:</label>
					<div class="col-md-8">
						<input type="number" name="Phone" class="form-control" placeholder="e.g: 03045636135" value="{{User.Phone}}" required/>
					</div>
				</div>
                <div class="form-group row">
				<label for="pass"class="control-label col-md-2">Address:</label>
				<div class="col-md-8">
				<textarea name="Address" cols="12" rows="6" class="form-control" placeholder="Address">{{User.Address}}</textarea>
				</div>
				</div>



                {% if isAdminControl == 'admin' %}
                <div class="form-group row">
					<label for="Phone" class="control-label col-md-2">User Type:</label>
					<div class="col-md-8">
                        <select name="account_type" value="{{User.account_type}}" class="form-control">

                                {% if User.account_type  == 'admin' %}
                                    <option value="admin">Admin</option>
                                    <option value="customer">Customer</option>

                                {% endif %}

                                 {% if User.account_type  == 'customer' %}

                                    <option value="customer">Customer</option>
                                   <option value="admin">Admin</option>

                                {% endif %}


                            </select>
                    </div>
				</div>
                {% endif %}
				
				<div class="form-group row ">
					<div class=" col-md-12 text-right">
                        <button type="submit" value="submit" name="submit" class="btn btn-success col-md-4" onclick=""><span class="glyphicon glyphicon-send"></span> UPDATE</button>
                    </div>
				</div>
			</div>	
			</form>

	</div>
         </div>
            </div>
        </div>
    </section>
    <!--================login_part end =================-->
{% endblock %}
